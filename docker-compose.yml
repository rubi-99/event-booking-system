version: '3.8'

services:
  # 1. Redis Cache & Distributed Lock Service
  redis:
    image: redis:7-alpine
    container_name: event_booking_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - event_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. FastAPI Backend Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event_booking_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=production
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - event_network

  # 3. Vite React Frontend (Served by Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: event_booking_frontend
    restart: always
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - event_network

networks:
  event_network:
    driver: bridge
