info:
  name: Event Management System API
  description: |
    Complete Postman collection for the Event Management System API.
    Built with FastAPI + Supabase + PostgreSQL.

    ## Authentication Flow
    1. Use **Auth > Signup** or **Auth > Login** to get a JWT token.
    2. The token is automatically saved to the `token` collection variable.
    3. All protected endpoints use `{{token}}` via Bearer auth.
  schema: https://schema.getpostman.com/json/collection/v2.1.0/collection.json

auth:
  type: bearer
  bearer:
    - key: token
      value: '{{token}}'
      type: string

variable:
  - key: base_url
    value: http://localhost:8000
    type: string
  - key: token
    value: ''
    type: string
  - key: user_id
    value: ''
    type: string
  - key: venue_id
    value: ''
    type: string
  - key: event_id
    value: ''
    type: string
  - key: booking_id
    value: ''
    type: string

item:
  # ────────────────────────────── Health ──────────────────────────────
  - name: Health
    item:
      - name: GET Root (Health Check)
        event:
          - listen: test
            script:
              exec:
                - 'pm.test("Status code is 200", function () {'
                - '  pm.response.to.have.status(200);'
                - '});'
                - 'pm.test("Response has status and message", function () {'
                - '  var json = pm.response.json();'
                - '  pm.expect(json).to.have.property("status");'
                - '  pm.expect(json).to.have.property("message");'
                - '});'
              type: text/javascript
        request:
          method: GET
          header: []
          url:
            raw: '{{base_url}}/'
            host: ['{{base_url}}']
            path:
              - ''
        response: []

  # ────────────────────────────── Auth ──────────────────────────────
  - name: Auth
    item:
      - name: POST Signup
        event:
          - listen: test
            script:
              exec:
                - 'pm.test("Status code is 201", function () {'
                - '  pm.response.to.have.status(201);'
                - '});'
                - 'pm.test("Response has user details", function () {'
                - '  var json = pm.response.json();'
                - '  pm.expect(json).to.have.property("id");'
                - '  pm.expect(json).to.have.property("email");'
                - '  pm.collectionVariables.set("user_id", json.id);'
                - '});'
              type: text/javascript
        request:
          method: POST
          header:
            - key: Content-Type
              value: application/json
            - key: Accept
              value: application/json
          body:
            mode: raw
            raw: >-
              {
                "email": "user@example.com",
                "password": "securepassword123",
                "first_name": "John",
                "last_name": "Doe",
                "role": "user"
              }
          url:
            raw: '{{base_url}}/auth/signup'
            host: ['{{base_url}}']
            path:
              - auth
              - signup
        response: []

      - name: POST Login
        event:
          - listen: test
            script:
              exec:
                - 'pm.test("Status code is 200", function () {'
                - '  pm.response.to.have.status(200);'
                - '});'
                - 'pm.test("Response has access_token and user", function () {'
                - '  var json = pm.response.json();'
                - '  pm.expect(json).to.have.property("access_token");'
                - '  pm.expect(json).to.have.property("token_type");'
                - '  pm.expect(json).to.have.property("user");'
                - '  pm.collectionVariables.set("token", json.access_token);'
                - '  pm.collectionVariables.set("user_id", json.user.id);'
                - '});'
              type: text/javascript
        request:
          method: POST
          header:
            - key: Content-Type
              value: application/json
            - key: Accept
              value: application/json
          body:
            mode: raw
            raw: >-
              {
                "email": "user@example.com",
                "password": "securepassword123"
              }
          url:
            raw: '{{base_url}}/auth/login'
            host: ['{{base_url}}']
            path:
              - auth
              - login
        response: []

      - name: GET Me (Profile)
        event:
          - listen: test
            script:
              exec:
                - 'pm.test("Status code is 200", function () {'
                - '  pm.response.to.have.status(200);'
                - '});'
                - 'pm.test("Response has current user details", function () {'
                - '  var json = pm.response.json();'
                - '  pm.expect(json).to.have.property("id");'
                - '  pm.expect(json).to.have.property("email");'
                - '});'
              type: text/javascript
        request:
          method: GET
          header:
            - key: Accept
              value: application/json
          url:
            raw: '{{base_url}}/auth/me'
            host: ['{{base_url}}']
            path:
              - auth
              - me
        response: []

      - name: PUT Update Profile
        event:
          - listen: test
            script:
              exec:
                - 'pm.test("Status code is 200", function () {'
                - '  pm.response.to.have.status(200);'
                - '});'
                - 'pm.test("Profile was updated", function () {'
                - '  var json = pm.response.json();'
                - '  pm.expect(json.first_name).to.eql("Jane");'
                - '});'
              type: text/javascript
        request:
          method: PUT
          header:
            - key: Content-Type
              value: application/json
            - key: Accept
              value: application/json
          body:
            mode: raw
            raw: >-
              {
                "first_name": "Jane",
                "last_name": "Doe"
              }
          url:
            raw: '{{base_url}}/auth/me'
            host: ['{{base_url}}']
            path:
              - auth
              - me
        response: []

      - name: POST Logout
        event:
          - listen: test
            script:
              exec:
                - 'pm.test("Status code is 204", function () {'
                - '  pm.response.to.have.status(204);'
                - '});'
              type: text/javascript
        request:
          method: POST
          header: []
          url:
            raw: '{{base_url}}/auth/logout'
            host: ['{{base_url}}']
            path:
              - auth
              - logout
        response: []

  # ────────────────────────────── Venues ──────────────────────────────
  - name: Venues
    item:
      - name: GET List All Venues
        event:
          - listen: test
            script:
              exec:
                - 'pm.test("Status code is 200", function () {'
                - '  pm.response.to.have.status(200);'
                - '});'
                - 'pm.test("Response is an array", function () {'
                - '  pm.expect(pm.response.json()).to.be.an("array");'
                - '});'
              type: text/javascript
        request:
          method: GET
          header: []
          url:
            raw: '{{base_url}}/venues'
            host: ['{{base_url}}']
            path:
              - venues
        response: []

      - name: POST Create Venue
        event:
          - listen: test
            script:
              exec:
                - 'pm.test("Status code is 201", function () {'
                - '  pm.response.to.have.status(201);'
                - '});'
                - 'pm.test("Venue was created", function () {'
                - '  var json = pm.response.json();'
                - '  pm.expect(json).to.have.property("id");'
                - '  pm.expect(json.name).to.eql("Grand Hall");'
                - '  pm.collectionVariables.set("venue_id", json.id);'
                - '});'
              type: text/javascript
        request:
          method: POST
          header:
            - key: Content-Type
              value: application/json
            - key: Accept
              value: application/json
          body:
            mode: raw
            raw: >-
              {
                "name": "Grand Hall",
                "location": "123 Main Street, New York, NY",
                "capacity": 500
              }
          url:
            raw: '{{base_url}}/venues'
            host: ['{{base_url}}']
            path:
              - venues
        response: []

      - name: GET Venue By ID
        event:
          - listen: test
            script:
              exec:
                - 'pm.test("Status code is 200", function () {'
                - '  pm.response.to.have.status(200);'
                - '});'
                - 'pm.test("Venue matches requested ID", function () {'
                - '  var json = pm.response.json();'
                - '  pm.expect(json.id).to.eql(pm.collectionVariables.get("venue_id"));'
                - '});'
              type: text/javascript
        request:
          method: GET
          header: []
          url:
            raw: '{{base_url}}/venues/{{venue_id}}'
            host: ['{{base_url}}']
            path:
              - venues
              - '{{venue_id}}'
        response: []

      - name: PUT Update Venue
        event:
          - listen: test
            script:
              exec:
                - 'pm.test("Status code is 200", function () {'
                - '  pm.response.to.have.status(200);'
                - '});'
                - 'pm.test("Venue was updated", function () {'
                - '  var json = pm.response.json();'
                - '  pm.expect(json.name).to.eql("Grand Hall VIP");'
                - '});'
              type: text/javascript
        request:
          method: PUT
          header:
            - key: Content-Type
              value: application/json
            - key: Accept
              value: application/json
          body:
            mode: raw
            raw: >-
              {
                "name": "Grand Hall VIP",
                "capacity": 400
              }
          url:
            raw: '{{base_url}}/venues/{{venue_id}}'
            host: ['{{base_url}}']
            path:
              - venues
              - '{{venue_id}}'
        response: []

      - name: DELETE Venue
        event:
          - listen: test
            script:
              exec:
                - 'pm.test("Status code is 204", function () {'
                - '  pm.response.to.have.status(204);'
                - '});'
              type: text/javascript
        request:
          method: DELETE
          header: []
          url:
            raw: '{{base_url}}/venues/{{venue_id}}'
            host: ['{{base_url}}']
            path:
              - venues
              - '{{venue_id}}'
        response: []

  # ────────────────────────────── Events ──────────────────────────────
  - name: Events
    item:
      - name: GET List All Events
        event:
          - listen: test
            script:
              exec:
                - 'pm.test("Status code is 200", function () {'
                - '  pm.response.to.have.status(200);'
                - '});'
                - 'pm.test("Response is an array", function () {'
                - '  pm.expect(pm.response.json()).to.be.an("array");'
                - '});'
              type: text/javascript
        request:
          method: GET
          header: []
          url:
            raw: '{{base_url}}/events'
            host: ['{{base_url}}']
            path:
              - events
        response: []

      - name: GET List Events (Filtered)
        event:
          - listen: test
            script:
              exec:
                - 'pm.test("Status code is 200", function () {'
                - '  pm.response.to.have.status(200);'
                - '});'
                - 'pm.test("Response is an array", function () {'
                - '  pm.expect(pm.response.json()).to.be.an("array");'
                - '});'
              type: text/javascript
        request:
          method: GET
          header: []
          url:
            raw: '{{base_url}}/events?status=published&category=concert'
            host: ['{{base_url}}']
            path:
              - events
            query:
              - key: status
                value: published
              - key: category
                value: concert
        response: []

      - name: POST Create Event
        event:
          - listen: test
            script:
              exec:
                - 'pm.test("Status code is 201", function () {'
                - '  pm.response.to.have.status(201);'
                - '});'
                - 'pm.test("Event was created", function () {'
                - '  var json = pm.response.json();'
                - '  pm.expect(json).to.have.property("id");'
                - '  pm.expect(json).to.have.property("title");'
                - '  pm.expect(json).to.have.property("venue");'
                - '  pm.expect(json).to.have.property("organizer");'
                - '  pm.collectionVariables.set("event_id", json.id);'
                - '});'
              type: text/javascript
        request:
          method: POST
          header:
            - key: Content-Type
              value: application/json
            - key: Accept
              value: application/json
          body:
            mode: raw
            raw: >-
              {
                "title": "Summer Jazz Night",
                "description": "An amazing evening of live jazz music.",
                "category": "concert",
                "event_poster_url": "https://example.com/posters/jazz-night.jpg",
                "venue_id": "{{venue_id}}",
                "start_time": "2026-12-01T19:00:00Z",
                "end_time": "2026-12-01T23:00:00Z",
                "total_tickets": 200,
                "ticket_price": 49.99,
                "status": "published"
              }
          url:
            raw: '{{base_url}}/events'
            host: ['{{base_url}}']
            path:
              - events
        response: []

      - name: GET Event By ID
        event:
          - listen: test
            script:
              exec:
                - 'pm.test("Status code is 200", function () {'
                - '  pm.response.to.have.status(200);'
                - '});'
                - 'pm.test("Event matches requested ID", function () {'
                - '  var json = pm.response.json();'
                - '  pm.expect(json.id).to.eql(pm.collectionVariables.get("event_id"));'
                - '});'
              type: text/javascript
        request:
          method: GET
          header: []
          url:
            raw: '{{base_url}}/events/{{event_id}}'
            host: ['{{base_url}}']
            path:
              - events
              - '{{event_id}}'
        response: []

      - name: PUT Update Event
        event:
          - listen: test
            script:
              exec:
                - 'pm.test("Status code is 200", function () {'
                - '  pm.response.to.have.status(200);'
                - '});'
                - 'pm.test("Event was updated", function () {'
                - '  var json = pm.response.json();'
                - '  pm.expect(json.title).to.eql("Summer Jazz Night - Sold Out");'
                - '});'
              type: text/javascript
        request:
          method: PUT
          header:
            - key: Content-Type
              value: application/json
            - key: Accept
              value: application/json
          body:
            mode: raw
            raw: >-
              {
                "title": "Summer Jazz Night - Sold Out",
                "ticket_price": 59.99
              }
          url:
            raw: '{{base_url}}/events/{{event_id}}'
            host: ['{{base_url}}']
            path:
              - events
              - '{{event_id}}'
        response: []

      - name: DELETE Event
        event:
          - listen: test
            script:
              exec:
                - 'pm.test("Status code is 204", function () {'
                - '  pm.response.to.have.status(204);'
                - '});'
              type: text/javascript
        request:
          method: DELETE
          header: []
          url:
            raw: '{{base_url}}/events/{{event_id}}'
            host: ['{{base_url}}']
            path:
              - events
              - '{{event_id}}'
        response: []

  # ────────────────────────────── Bookings ──────────────────────────────
  - name: Bookings
    item:
      - name: POST Create Booking
        event:
          - listen: test
            script:
              exec:
                - 'pm.test("Status code is 201", function () {'
                - '  pm.response.to.have.status(201);'
                - '});'
                - 'pm.test("Booking was created", function () {'
                - '  var json = pm.response.json();'
                - '  pm.expect(json).to.have.property("id");'
                - '  pm.expect(json).to.have.property("status");'
                - '  pm.expect(json).to.have.property("num_tickets");'
                - '  pm.expect(json).to.have.property("total_price");'
                - '  pm.expect(json).to.have.property("event");'
                - '  pm.expect(json).to.have.property("user");'
                - '  pm.collectionVariables.set("booking_id", json.id);'
                - '});'
              type: text/javascript
        request:
          method: POST
          header:
            - key: Content-Type
              value: application/json
            - key: Accept
              value: application/json
          body:
            mode: raw
            raw: >-
              {
                "event_id": "{{event_id}}",
                "num_tickets": 2
              }
          url:
            raw: '{{base_url}}/bookings'
            host: ['{{base_url}}']
            path:
              - bookings
        response: []

      - name: GET My Bookings
        event:
          - listen: test
            script:
              exec:
                - 'pm.test("Status code is 200", function () {'
                - '  pm.response.to.have.status(200);'
                - '});'
                - 'pm.test("Response is an array", function () {'
                - '  pm.expect(pm.response.json()).to.be.an("array");'
                - '});'
              type: text/javascript
        request:
          method: GET
          header: []
          url:
            raw: '{{base_url}}/bookings/my'
            host: ['{{base_url}}']
            path:
              - bookings
              - my
        response: []

      - name: GET Booking By ID
        event:
          - listen: test
            script:
              exec:
                - 'pm.test("Status code is 200", function () {'
                - '  pm.response.to.have.status(200);'
                - '});'
                - 'pm.test("Booking matches requested ID", function () {'
                - '  var json = pm.response.json();'
                - '  pm.expect(json.id).to.eql(pm.collectionVariables.get("booking_id"));'
                - '});'
              type: text/javascript
        request:
          method: GET
          header: []
          url:
            raw: '{{base_url}}/bookings/{{booking_id}}'
            host: ['{{base_url}}']
            path:
              - bookings
              - '{{booking_id}}'
        response: []

      - name: POST Cancel Booking
        event:
          - listen: test
            script:
              exec:
                - 'pm.test("Status code is 200", function () {'
                - '  pm.response.to.have.status(200);'
                - '});'
                - 'pm.test("Booking was cancelled", function () {'
                - '  var json = pm.response.json();'
                - '  pm.expect(json.status).to.eql("cancelled");'
                - '});'
              type: text/javascript
        request:
          method: POST
          header: []
          url:
            raw: '{{base_url}}/bookings/{{booking_id}}/cancel'
            host: ['{{base_url}}']
            path:
              - bookings
              - '{{booking_id}}'
              - cancel
        response: []

      - name: POST Refund Booking (Admin)
        event:
          - listen: test
            script:
              exec:
                - 'pm.test("Status code is 200", function () {'
                - '  pm.response.to.have.status(200);'
                - '});'
                - 'pm.test("Booking was refunded", function () {'
                - '  var json = pm.response.json();'
                - '  pm.expect(json.status).to.eql("refunded");'
                - '});'
              type: text/javascript
        request:
          method: POST
          header: []
          url:
            raw: '{{base_url}}/bookings/{{booking_id}}/refund'
            host: ['{{base_url}}']
            path:
              - bookings
              - '{{booking_id}}'
              - refund
        response: []
