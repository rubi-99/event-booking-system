info:
  name: EMS - Events
  description: |
    Event CRUD and filtering endpoints.
    Events can be created, updated, and deleted by **ORGANIZER** or **ADMIN** users.
    Listing and fetching individual events are public.
  schema: https://schema.getpostman.com/json/collection/v2.1.0/collection.json

auth:
  type: bearer
  bearer:
    - key: token
      value: '{{token}}'
      type: string

variable:
  - key: base_url
    value: http://localhost:8000
    type: string
  - key: token
    value: ''
    type: string
  - key: venue_id
    value: ''
    type: string
  - key: event_id
    value: ''
    type: string

item:
  - name: GET List All Events
    event:
      - listen: test
        script:
          exec:
            - 'pm.test("Status code is 200", function () {'
            - '  pm.response.to.have.status(200);'
            - '});'
            - 'pm.test("Response is an array", function () {'
            - '  pm.expect(pm.response.json()).to.be.an("array");'
            - '});'
          type: text/javascript
    request:
      method: GET
      header: []
      url:
        raw: '{{base_url}}/events'
        host: ['{{base_url}}']
        path:
          - events
    response: []

  - name: GET List Events (Filtered)
    event:
      - listen: test
        script:
          exec:
            - 'pm.test("Status code is 200", function () {'
            - '  pm.response.to.have.status(200);'
            - '});'
            - 'pm.test("Response is an array", function () {'
            - '  pm.expect(pm.response.json()).to.be.an("array");'
            - '});'
          type: text/javascript
    request:
      method: GET
      header: []
      url:
        raw: '{{base_url}}/events?status=published&category=concert'
        host: ['{{base_url}}']
        path:
          - events
        query:
          - key: status
            value: published
          - key: category
            value: concert
    response: []

  - name: POST Create Event
    event:
      - listen: test
        script:
          exec:
            - 'pm.test("Status code is 201", function () {'
            - '  pm.response.to.have.status(201);'
            - '});'
            - 'pm.test("Event was created", function () {'
            - '  var json = pm.response.json();'
            - '  pm.expect(json).to.have.property("id");'
            - '  pm.expect(json).to.have.property("title");'
            - '  pm.expect(json).to.have.property("venue");'
            - '  pm.expect(json).to.have.property("organizer");'
            - '  pm.collectionVariables.set("event_id", json.id);'
            - '});'
          type: text/javascript
    request:
      method: POST
      header:
        - key: Content-Type
          value: application/json
        - key: Accept
          value: application/json
      body:
        mode: raw
        raw: >-
          {
            "title": "Summer Jazz Night",
            "description": "An amazing evening of live jazz music.",
            "category": "concert",
            "event_poster_url": "https://example.com/posters/jazz-night.jpg",
            "venue_id": "{{venue_id}}",
            "start_time": "2026-12-01T19:00:00Z",
            "end_time": "2026-12-01T23:00:00Z",
            "total_tickets": 200,
            "ticket_price": 49.99,
            "status": "published"
          }
      url:
        raw: '{{base_url}}/events'
        host: ['{{base_url}}']
        path:
          - events
    response: []

  - name: GET Event By ID
    event:
      - listen: test
        script:
          exec:
            - 'pm.test("Status code is 200", function () {'
            - '  pm.response.to.have.status(200);'
            - '});'
            - 'pm.test("Event matches requested ID", function () {'
            - '  var json = pm.response.json();'
            - '  pm.expect(json.id).to.eql(pm.collectionVariables.get("event_id"));'
            - '});'
          type: text/javascript
    request:
      method: GET
      header: []
      url:
        raw: '{{base_url}}/events/{{event_id}}'
        host: ['{{base_url}}']
        path:
          - events
          - '{{event_id}}'
    response: []

  - name: PUT Update Event
    event:
      - listen: test
        script:
          exec:
            - 'pm.test("Status code is 200", function () {'
            - '  pm.response.to.have.status(200);'
            - '});'
            - 'pm.test("Event was updated", function () {'
            - '  var json = pm.response.json();'
            - '  pm.expect(json.title).to.eql("Summer Jazz Night - Sold Out");'
            - '});'
          type: text/javascript
    request:
      method: PUT
      header:
        - key: Content-Type
          value: application/json
        - key: Accept
          value: application/json
      body:
        mode: raw
        raw: >-
          {
            "title": "Summer Jazz Night - Sold Out",
            "ticket_price": 59.99
          }
      url:
        raw: '{{base_url}}/events/{{event_id}}'
        host: ['{{base_url}}']
        path:
          - events
          - '{{event_id}}'
    response: []

  - name: DELETE Event
    event:
      - listen: test
        script:
          exec:
            - 'pm.test("Status code is 204", function () {'
            - '  pm.response.to.have.status(204);'
            - '});'
          type: text/javascript
    request:
      method: DELETE
      header: []
      url:
        raw: '{{base_url}}/events/{{event_id}}'
        host: ['{{base_url}}']
        path:
          - events
          - '{{event_id}}'
    response: []
